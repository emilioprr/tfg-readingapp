spring.application.name=reading-app

# Base de datos en memoria para los tests (no depende del Postgres local)
spring.datasource.url=jdbc:h2:mem:readingapp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

google.books.api.key=test
jwt.secret=test-secret-de-al-menos-32-caracteres-para-hs256
jwt.expiration=86400000
